# Publishes web_deploy/ to GitHub Pages on every push to main.
#
# Pages can only serve the repo root or /docs on its own, and the app lives in
# a subfolder, so this workflow uploads just that folder as the site artifact.
# It also runs the tests first, so a broken mask never reaches the live URL.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        working-directory: web_deploy
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_deploy

      - id: deployment
        uses: actions/deploy-pages@v4
