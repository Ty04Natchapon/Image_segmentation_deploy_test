# Static site — no build step, no bundler. Publish the folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # Allow this origin to use the camera, and nobody embedding us to.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

    # Deliberately NOT setting Cross-Origin-Embedder-Policy. Turning on
    # cross-origin isolation would block the model downloads from
    # storage.googleapis.com and the WASM from jsDelivr, since neither serves
    # a CORP header. The single-threaded SIMD build we use does not need it.

# Models and WASM are content-addressed by version; cache them hard.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
